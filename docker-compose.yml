services:
  shop:
    container_name: temp-shop
    build: .
    environment:
      # Tarayıcının gittiği adres (makinenizden erişilebilir olmalı)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      # Sunucu tarafı (SSR) istekleri: konteyner içinde "localhost" konteynerin kendisidir
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://host.docker.internal:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux için; Docker Desktop'ta zaten var
    ports:
      - "3000:3000" # backend CORS varsayılanı http://localhost:3000
    restart: unless-stopped
